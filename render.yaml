services:
  # PostgreSQL Database
  - type: pserv
    name: internal-rag-postgres
    env: docker
    plan: free
    region: oregon
    ipAllowList: []
    databases:
      - name: internal_rag_db
        user: internal_rag_user

  # Backend API Service
  - type: web
    name: internal-rag-backend
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: internal_rag_db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: internal-rag-frontend
          property: host

  # Frontend Static Site
  - type: web
    name: internal-rag-frontend
    runtime: static
    plan: free
    region: oregon
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: internal-rag-backend
          property: host
